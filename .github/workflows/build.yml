name: Build TorRoute

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build with MSVC
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /EHsc /std:c++17 TorRoute.cpp ws2_32.lib wininet.lib /Fe:TorRoute.exe
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item TorRoute.exe, rules.txt, config.txt, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath TorRoute-Windows-x64.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorRoute-Windows-x64
          path: TorRoute-Windows-x64.zip
          retention-days: 30
