name: Build TorRoute

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Locate and load MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`where vswhere`) do set "VSWHERE=%%i"
          if not defined VSWHERE set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" exit /b 1
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          where cl
          cl /nologo /O2 /EHsc /std:c++17 TorRoute.cpp ws2_32.lib wininet.lib advapi32.lib /Fe:TorRoute.exe
          if errorlevel 1 exit /b 1

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item TorRoute.exe, rules.txt, config.txt, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath TorRoute-Windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorRoute-Windows-x64
          path: TorRoute-Windows-x64.zip
          retention-days: 30

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.$env:GITHUB_RUN_NUMBER"
          gh release create $tag TorRoute-Windows-x64.zip --title "TorRoute $tag" --generate-notes
